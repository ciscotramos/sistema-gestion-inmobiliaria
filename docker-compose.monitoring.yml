# Stack de observabilidad (Taller Sesión 30): Prometheus + Alertmanager + Grafana.
# Requisito: el backend corre con el perfil "app" de docker-compose.yml (red inmobiliaria_default).
# Preparar el token y levantar todo:  ./scripts/monitoreo-preparar.sh && docker compose -f docker-compose.monitoring.yml up -d
name: inmobiliaria-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: inmobiliaria-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./monitoring/secrets/monitoring_token:/etc/prometheus/secrets/monitoring_token:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para medir un backend que corre fuera de Docker
    networks: [default, backend]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: inmobiliaria-alertmanager
    command:
      - --config.file=/etc/alertmanager/${ALERTMANAGER_CONFIG:-alertmanager.yml}
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - ./monitoring/secrets:/secrets:ro
      - alertmanager-data:/alertmanager
    networks: [default, backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: inmobiliaria-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Laboratorio local (puerto solo en 127.0.0.1). Cambia la clave con GRAFANA_ADMIN_PASSWORD en .env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-utp_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/inmobiliaria-observabilidad.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  backend:
    name: inmobiliaria_default   # red del backend y MySQL (docker-compose.yml)
    external: true

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
