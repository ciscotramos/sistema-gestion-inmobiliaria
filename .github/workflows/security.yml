name: Seguridad

# Detección de secretos filtrados y análisis estático de código.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detección de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gitleaks.tgz gitleaks
      - name: Escanear el repositorio y su historial
        run: ./gitleaks detect --source . --redact --verbose

  codeql:
    name: Análisis estático (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Compilar el backend para el análisis
        if: matrix.language == 'java-kotlin'
        run: mvn -B -f backend/pom.xml -DskipTests package
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
