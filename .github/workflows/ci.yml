name: CI

# Integración continua: compila el backend, ejecuta las pruebas unitarias
# (sin base de datos) y construye el frontend en cada push o Pull Request.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y empaquetar
        run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Pruebas unitarias (sin base de datos)
        run: mvn -B -f backend/pom.xml -Dtest='*UnitTest' -Dsurefire.failIfNoSpecifiedTests=false test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: front
      - name: Construir
        run: npm run build
        working-directory: front

  base-datos:
    name: Base de datos (Master/Replica)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar MySQL Master y Replica
        run: |
          cat > .env <<EOF
          DB_PASSWORD=ci-master-$(openssl rand -hex 8)
          DB_REPLICATION_PASSWORD=ci-repl-$(openssl rand -hex 8)
          JWT_SECRET=ci-jwt-$(openssl rand -hex 24)
          APP_ADMIN_EMAIL=admin-ci@ejemplo.com
          APP_ADMIN_PASSWORD=Ci-$(openssl rand -hex 8)
          MONITORING_TOKEN=ci-mon-$(openssl rand -hex 16)
          MONITORING_SIMULATION=true
          EOF
          docker compose up -d --wait mysql-master mysql-replica
          docker compose up replica-init --exit-code-from replica-init
      - name: Verificar esquema y replicación
        run: ./scripts/verificar-replicacion.sh
      - name: Prueba de incidentes contra backend y MySQL reales
        run: |
          docker compose --profile app up -d --build backend
          set -a; source .env; set +a
          ./scripts/prueba-incidentes.sh
      - name: Monitoreo y alertas (Prometheus, Alertmanager, Grafana)
        run: |
          set -a; source .env; set +a
          set -o pipefail
          ./scripts/prueba-monitoreo.sh 2>&1 | tee evidencia-monitoreo.log
      - name: Guardar la evidencia del monitoreo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-monitoreo
          path: evidencia-monitoreo.log
          if-no-files-found: ignore
      - name: Registros si falla
        if: failure()
        run: |
          docker compose --profile app logs --tail=150 backend
          docker compose logs --tail=30 mysql-master mysql-replica
          docker compose -f docker-compose.monitoring.yml logs --tail=60 prometheus alertmanager grafana

  continuidad:
    name: Continuidad (respaldo, restauración y simulacro DRP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar MySQL Master y Replica
        run: |
          cat > .env <<EOF
          DB_PASSWORD=ci-master-$(openssl rand -hex 8)
          DB_REPLICATION_PASSWORD=ci-repl-$(openssl rand -hex 8)
          JWT_SECRET=ci-jwt-$(openssl rand -hex 24)
          EOF
          docker compose up -d --wait mysql-master mysql-replica
          docker compose up replica-init --exit-code-from replica-init
      - name: Simulacro de desastre (Full + binlogs, restauración verificada, retención y promoción de la Replica)
        run: |
          set -o pipefail
          ./scripts/simulacro-desastre.sh 2>&1 | tee evidencia-continuidad.log
      - name: Guardar la evidencia (registro del simulacro)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-continuidad
          path: evidencia-continuidad.log
          if-no-files-found: ignore
      - name: Copia externa del respaldo (fuera del servidor, 30 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-externo
          path: respaldos/
          retention-days: 30
          if-no-files-found: ignore
      - name: Registros si falla
        if: failure()
        run: |
          docker compose --profile app logs --tail=60 backend
          docker compose logs --tail=40 mysql-master mysql-replica

  alta-disponibilidad:
    name: Alta disponibilidad (2 nodos de API + Nginx, prueba de failover)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar base de datos, 2 nodos de la API y el balanceador
        run: |
          cat > .env <<EOF2
          DB_PASSWORD=ci-master-$(openssl rand -hex 8)
          DB_REPLICATION_PASSWORD=ci-repl-$(openssl rand -hex 8)
          JWT_SECRET=ci-jwt-$(openssl rand -hex 24)
          EOF2
          docker compose up -d --wait mysql-master mysql-replica
          docker compose up replica-init --exit-code-from replica-init
          docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d --build --wait balanceador
          docker compose -f docker-compose.yml -f docker-compose.ha.yml ps
      - name: Prueba de failover con tráfico continuo
        run: |
          set -o pipefail
          ./scripts/prueba-failover.sh 2>&1 | tee evidencia-failover.log
      - name: Guardar la evidencia (registro del failover)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-failover
          path: evidencia-failover.log
          if-no-files-found: ignore
      - name: Registros si falla
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ha.yml logs --tail=60 balanceador api-node-1 api-node-2

  respaldo-automatico:
    name: Respaldo automático (cifrado AES-256, copia inmutable y restauración externa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar MySQL, almacén S3 y contenedor de respaldos (ciclo cada 20 s para la prueba)
        run: |
          cat > .env <<EOF2
          DB_PASSWORD=ci-master-$(openssl rand -hex 8)
          DB_REPLICATION_PASSWORD=ci-repl-$(openssl rand -hex 8)
          JWT_SECRET=ci-jwt-$(openssl rand -hex 24)
          BACKUP_PASS=ci-backup-$(openssl rand -hex 16)
          BACKUP_INTERVALO_SEGUNDOS=20
          EOF2
          docker compose up -d --wait mysql-master mysql-replica
          docker compose up replica-init --exit-code-from replica-init
          docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d --build respaldo
      - name: Prueba de respaldo automático, inmutabilidad y restauración desde la copia externa
        run: |
          set -o pipefail
          ./scripts/prueba-respaldo-automatico.sh 2>&1 | tee evidencia-respaldo-automatico.log
      - name: Guardar la evidencia (registro de la prueba y del contenedor de respaldos)
        if: always()
        run: docker logs inmobiliaria-respaldo > registro-contenedor-respaldo.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-respaldo-automatico
          path: |
            evidencia-respaldo-automatico.log
            registro-contenedor-respaldo.log
          if-no-files-found: ignore
      - name: Registros si falla
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.backup.yml logs --tail=60 respaldo almacen-s3
