name: CI

# Integración continua: compila el backend, ejecuta las pruebas unitarias
# (sin base de datos) y construye el frontend en cada push o Pull Request.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y empaquetar
        run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Pruebas unitarias (sin base de datos)
        run: mvn -B -f backend/pom.xml -Dtest='*UnitTest' -Dsurefire.failIfNoSpecifiedTests=false test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: front
      - name: Construir
        run: npm run build
        working-directory: front

  base-datos:
    name: Base de datos (Master/Replica)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar MySQL Master y Replica
        run: |
          cat > .env <<EOF
          DB_PASSWORD=ci-master-$(openssl rand -hex 8)
          DB_REPLICATION_PASSWORD=ci-repl-$(openssl rand -hex 8)
          JWT_SECRET=ci-jwt-$(openssl rand -hex 24)
          APP_ADMIN_EMAIL=admin-ci@ejemplo.com
          APP_ADMIN_PASSWORD=Ci-$(openssl rand -hex 8)
          EOF
          docker compose up -d --wait mysql-master mysql-replica
          docker compose up replica-init --exit-code-from replica-init
      - name: Verificar esquema y replicación
        run: ./scripts/verificar-replicacion.sh
      - name: Prueba de incidentes contra backend y MySQL reales
        run: |
          docker compose --profile app up -d --build backend
          set -a; source .env; set +a
          ./scripts/prueba-incidentes.sh
      - name: Registros si falla
        if: failure()
        run: docker compose logs --tail=80
