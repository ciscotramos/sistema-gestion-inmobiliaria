name: CI

# Integración continua: compila el backend, ejecuta las pruebas unitarias
# (sin base de datos) y construye el frontend en cada push o Pull Request.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y empaquetar
        run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Pruebas unitarias (sin base de datos)
        run: mvn -B -f backend/pom.xml -Dtest='*UnitTest' -Dsurefire.failIfNoSpecifiedTests=false test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: front
      - name: Construir
        run: npm run build
        working-directory: front
