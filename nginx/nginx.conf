# Balanceador de carga del Sistema Web de Gestión Inmobiliaria (Taller Sesión 32).
# Reparte las peticiones entre los nodos de la API y deja de enviar tráfico a un nodo caído.
worker_processes auto;
events { worker_connections 1024; }

http {
  # Cada línea muestra a qué nodo fue la petición y cuánto tardó: es la evidencia de la distribución y del failover.
  log_format ha '$time_iso8601 "$request" status=$status upstream=$upstream_addr '
                'upstream_status=$upstream_status rt=$request_time';
  access_log /dev/stdout ha;
  error_log  /dev/stderr notice;

  upstream backend_cluster {
    # Chequeo de salud pasivo: 2 fallos seguidos sacan al nodo de la rotación durante 10 s.
    server api-node-1:8080 max_fails=2 fail_timeout=10s;
    server api-node-2:8080 max_fails=2 fail_timeout=10s;
  }

  server {
    listen 80;

    # Salud del propio balanceador (la usa el healthcheck de Docker).
    location = /lb-health {
      access_log off;
      default_type text/plain;
      return 200 "balanceador ok\n";
    }

    location / {
      proxy_pass http://backend_cluster;
      proxy_connect_timeout 1s;        # un nodo caído se detecta en 1 s y la petición pasa al otro
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Served-By $upstream_addr always;
    }
  }
}
