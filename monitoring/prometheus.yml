# Prometheus del proyecto (Taller Sesión 30, Ficha 02). Modelo PULL: Prometheus va a buscar las métricas.
global:
  scrape_interval: 15s       # frecuencia de recolección
  evaluation_interval: 15s   # frecuencia con la que se evalúan las reglas de alerta

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Backend Spring Boot. Si lo ejecutas FUERA de Docker (mvn spring-boot:run), cambia el target a
  # 'host.docker.internal:8080' (docker-compose.monitoring.yml ya define ese nombre en Linux).
  - job_name: 'inmobiliaria_api'
    metrics_path: '/actuator/prometheus'
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/monitoring_token
    static_configs:
      - targets: ['inmobiliaria-backend:8080']
        labels:
          sistema: 'gestion-inmobiliaria'
          entorno: 'laboratorio'

  # El propio Prometheus y Alertmanager también se vigilan (quien vigila debe ser vigilado)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
