# Variante con Discord: además del ticket, publica la alerta en un canal del equipo.
# Uso:
#   1) Crea el webhook en Discord (Canal > Editar canal > Integraciones > Webhooks > Copiar URL).
#   2) printf '%s' 'URL_DEL_WEBHOOK' > monitoring/secrets/discord_webhook   (no se sube a Git)
#   3) ALERTMANAGER_CONFIG=alertmanager.discord.yml docker compose -f docker-compose.monitoring.yml up -d
route:
  receiver: ticket-y-discord
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: ticket-y-discord
    webhook_configs:
      - url: http://inmobiliaria-backend:8080/api/monitoreo/alertas
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /secrets/monitoring_token
    discord_configs:
      - webhook_url_file: /secrets/discord_webhook
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔴 ALERTA{{ else }}✅ RESUELTA{{ end }} {{ .CommonLabels.alertname }} ({{ .CommonLabels.priority }})'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'
