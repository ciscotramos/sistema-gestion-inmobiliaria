# =============================================================================
# CONFIGURACIÓN DEL SERVIDOR
# =============================================================================
server.port=${SERVER_PORT:8080}

# =============================================================================
# CONFIGURACIÓN DE REPLICACIÓN MYSQL (MASTER & REPLICA)
# =============================================================================
# Master (puerto 3306)
datasource.master.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT_MASTER:3306}/${DB_NAME:inmobiliaria_db}?sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&allowPublicKeyRetrieval=true
datasource.master.username=${DB_USER:root}
datasource.master.password=${DB_PASSWORD}
datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver

# Replica (puerto 3307)
datasource.replica.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT_REPLICA:3307}/${DB_NAME:inmobiliaria_db}?sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&allowPublicKeyRetrieval=true
datasource.replica.username=${DB_USER_REPLICA:${DB_USER:root}}
datasource.replica.password=${DB_PASSWORD_REPLICA:${DB_PASSWORD}}
datasource.replica.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================================================
# CONFIGURACIÓN DE SEGURIDAD Y JWT
# =============================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:7200000}

# =============================================================================
# DOCUMENTACIÓN DE LA API (SpringDoc OpenAPI 2.6.0)
# =============================================================================
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# =============================================================================
# ENDURECIMIENTO DE SEGURIDAD
# =============================================================================
# CORS: en producción define solo el dominio del frontend (varios separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Usuarios de demostración (contraseñas conocidas): NUNCA activar en producción
app.seed-demo-users=${SEED_DEMO_USERS:false}
# Primer administrador real (solo si aún no existe): define ambas variables
app.bootstrap-admin.email=${APP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
# Detrás del proxy de Render: respeta X-Forwarded-* (IP real del cliente para el límite de intentos)
server.forward-headers-strategy=native
# Los errores nunca exponen mensajes internos, trazas ni detalles de validación
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
