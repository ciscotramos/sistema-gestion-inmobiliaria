# Base de datos local: MySQL 8.0 con un Master (escrituras) y una Replica (lecturas).
# La replicación usa GTID y se configura sola con el servicio `replica-init`.
#
# Uso:
#   cp .env.example .env        # y cambia las contraseñas
#   docker compose up -d
#   docker compose --profile app up -d --build   # además levanta el backend
name: inmobiliaria

services:
  mysql-master:
    image: mysql:8.0
    container_name: inmobiliaria-master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:-inmobiliaria_db}
      MYSQL_REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:?Define DB_REPLICATION_PASSWORD en .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT_MASTER:-3306}:3306"
    volumes:
      - master-data:/var/lib/mysql
      - ./db/master/master.cnf:/etc/mysql/conf.d/master.cnf:ro
      - ./db/master/01-replicacion.sh:/docker-entrypoint-initdb.d/01-replicacion.sh:ro
      - ./backend/schema_v1.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mysql-replica:
    image: mysql:8.0
    container_name: inmobiliaria-replica
    restart: unless-stopped
    depends_on:
      mysql-master:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD_REPLICA:-${DB_PASSWORD}}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT_REPLICA:-3307}:3306"
    volumes:
      - replica-data:/var/lib/mysql
      - ./db/replica/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Contenedor de un solo uso: conecta la Replica al Master y termina.
  replica-init:
    image: mysql:8.0
    container_name: inmobiliaria-replica-init
    restart: "no"
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
    environment:
      MASTER_ROOT_PASSWORD: ${DB_PASSWORD}
      REPLICA_ROOT_PASSWORD: ${DB_PASSWORD_REPLICA:-${DB_PASSWORD}}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD}
    volumes:
      - ./db/replica/02-iniciar-replicacion.sh:/iniciar-replicacion.sh:ro
    entrypoint: ["bash", "/iniciar-replicacion.sh"]

  backend:
    profiles: ["app"]
    build: ./backend
    container_name: inmobiliaria-backend
    depends_on:
      replica-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: mysql-master
      DB_HOST_REPLICA: mysql-replica
      DB_PORT_MASTER: 3306
      DB_PORT_REPLICA: 3306
      DB_NAME: ${DB_NAME:-inmobiliaria_db}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PASSWORD_REPLICA: ${DB_PASSWORD_REPLICA:-${DB_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      DB_SSL_MODE: DISABLED
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  master-data:
  replica-data:
